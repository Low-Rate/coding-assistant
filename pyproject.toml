[project]
name = "coding-assistant"
version = "0.1.0"
description = "Local-first AI coding assistant with TUI, memory, and RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.52.0",
    "ollama>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=0.23.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
    "watchdog>=3.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]
lsp = [
    "python-lsp-server>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_assistant*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TCH", "PT", "PTH", "PL", "TRY", "NPY", "B", "A", "C4", "SIM", "PIE", "TID", "ARG", "PD", "RUF", "RET", "ERA", "ICN", "LOG", "PERF", "NPY", "G"]
ignore = ["S101", "T201", "T203", "ARG001", "ARG002"]
per-file-ignores = { "tests/*" = ["S101", "T201", "T203", "ARG001", "ARG002"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.typer]
rich = true